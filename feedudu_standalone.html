<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>肥嘟嘟 · 程序化 Three.js 模型（单文件版）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; left: 16px; top: 16px; z-index: 10; color: #3a3326;
    background: rgba(255,255,255,0.82); padding: 12px 14px; border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12); max-width: 320px; line-height: 1.5; font-size: 13px; }
  #hud b { font-size: 15px; }
  #hud .tip { color: #7a6f57; margin-top: 6px; }
  #toolbar { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: flex; gap: 8px; }
  #toolbar button { border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 13px;
    background: #f4c020; color: #3a3326; box-shadow: 0 3px 10px rgba(0,0,0,0.15); font-weight: 600; }
  #toolbar button.ghost { background: rgba(255,255,255,0.85); color: #3a3326; }
</style>
<script src="https://unpkg.com/three@0.137.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.137.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <b>肥嘟嘟 · 程序化重建</b><br />
  黄色卡通玩偶：梨形大肚、两长圆耳（左竖右张）、大棕鼻、白眼深棕瞳、短臂抱肚、V 字脚、右后粗尾。
  <div class="tip">鼠标拖拽=旋转；滚轮=缩放；右侧面板可实时调参二次编辑。</div>
</div>
<div id="toolbar">
  <button id="reset">恢复默认</button>
  <button id="shot" class="ghost">保存 PNG</button>
</div>

<script>
const GUI = (window.lil && window.lil.GUI) || window.GUI;
const YELLOW = new THREE.Color('#ffcf3a');
const CREAM  = new THREE.Color('#ffe9a8');
const NOSE   = new THREE.Color('#6b3a1f');
const PUPIL  = new THREE.Color('#3a241a');
const WHITE  = new THREE.Color('#ffffff');

const DEFAULTS = { bellyBulge:1.0, earSpread:1.0, noseSize:1.0, eyeSize:1.0, tailLift:1.0, bodyHue:0, lean:0.04, facing:-0.30 };

function buildBodyGeometry() {
  const profile = [[0.02,-1.20],[0.55,-1.05],[0.95,-0.80],[1.20,-0.45],[1.24,-0.10],
    [1.14,0.25],[0.96,0.58],[0.82,0.88],[0.72,1.12],[0.52,1.32],[0.22,1.44],[0.00,1.50]]
    .map(([r,y]) => new THREE.Vector2(r,y));
  const geo = new THREE.LatheGeometry(profile, 120, Math.PI*1.5, Math.PI*2);
  geo.computeVertexNormals(); return geo;
}
function applyBellyVertexColors(geo, bellyBulge) {
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count*3); const c = new THREE.Color();
  for (let i=0;i<pos.count;i++){ const y=pos.getY(i), z=pos.getZ(i);
    const lower = 1 - THREE.MathUtils.smoothstep(y,0.10,1.00);
    const front = THREE.MathUtils.smoothstep(z,-0.10,0.95);
    const m = THREE.MathUtils.clamp(lower*front*bellyBulge,0,1);
    c.copy(YELLOW).lerp(CREAM, m*0.9);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  geo.attributes.color.needsUpdate = true;
}
function taperedTube(curve, tubularSegments, rBase, rTip, radialSegments) {
  const geo = new THREE.TubeGeometry(curve, tubularSegments, 1, radialSegments, false);
  const pos = geo.attributes.position; const v = new THREE.Vector3(), center = new THREE.Vector3();
  for (let i=0;i<=tubularSegments;i++){ const t=i/tubularSegments; curve.getPointAt(t,center);
    const r = rBase + (rTip-rBase)*t;
    for (let j=0;j<=radialSegments;j++){ const idx=i*(radialSegments+1)+j;
      v.fromBufferAttribute(pos,idx).sub(center).multiplyScalar(r).add(center); pos.setXYZ(idx,v.x,v.y,v.z); } }
  geo.computeVertexNormals(); return geo;
}
function orientBetween(mesh, from, to) {
  const dir = new THREE.Vector3().subVectors(to,from);
  mesh.position.copy(from).addScaledVector(dir,0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
}
// 自实现胶囊体（兼容无 CapsuleGeometry 的 three 版本）：沿 Y 轴的圆柱 + 两端半球
function makeCapsule(radius, length, radialSeg) {
  radialSeg = radialSeg || 20;
  const half = length/2, N = 12, pts = [];
  for (let i=0;i<=N;i++){ const a=-Math.PI/2 + (Math.PI/2)*(i/N); pts.push(new THREE.Vector2(radius*Math.cos(a), -half + radius*Math.sin(a))); }
  for (let i=1;i<=N;i++){ const a=(Math.PI/2)*(i/N); pts.push(new THREE.Vector2(radius*Math.cos(a), half + radius*Math.sin(a))); }
  const g = new THREE.LatheGeometry(pts, radialSeg); g.computeVertexNormals(); return g;
}

function createFeeduduModel(initial={}) {
  const params = { ...DEFAULTS, ...initial };
  const root = new THREE.Group(); root.name='FeeduduRoot';
  const facing = new THREE.Group(); facing.name='Facing';
  const group = new THREE.Group(); group.name='Feedudu';
  root.add(facing); facing.add(group);
  const bodyVertexMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.60, metalness:0.0 });
  const yellowMat = new THREE.MeshStandardMaterial({ color:YELLOW.clone(), roughness:0.60, metalness:0.0 });
  const noseMat = new THREE.MeshStandardMaterial({ color:NOSE.clone(), roughness:0.30, metalness:0.0 });
  const scleraMat = new THREE.MeshStandardMaterial({ color:WHITE.clone(), roughness:0.28, metalness:0.0 });
  const pupilMat = new THREE.MeshStandardMaterial({ color:PUPIL.clone(), roughness:0.20, metalness:0.0 });
  const shineMat = new THREE.MeshStandardMaterial({ color:WHITE.clone(), roughness:0.05, metalness:0.0 });

  const bodyGeo = buildBodyGeometry(); applyBellyVertexColors(bodyGeo, params.bellyBulge);
  const body = new THREE.Mesh(bodyGeo, bodyVertexMat); body.name='body'; body.castShadow=true; body.receiveShadow=true; group.add(body);

  const earLGeo = makeCapsule(0.17,0.90,20);
  const earRGeo = makeCapsule(0.21,1.18,22);
  const earL = new THREE.Mesh(earLGeo, yellowMat); earL.name='ear_L'; earL.position.set(-0.36,1.45,-0.05); earL.castShadow=true; group.add(earL);
  const earR = new THREE.Mesh(earRGeo, yellowMat); earR.name='ear_R'; earR.position.set(0.40,1.46,-0.05); earR.castShadow=true; group.add(earR);

  const noseGeo = new THREE.SphereGeometry(1,32,24); noseGeo.scale(0.24,0.20,0.18);
  const nose = new THREE.Mesh(noseGeo, noseMat); nose.name='nose'; nose.position.set(0.0,0.82,0.84); nose.rotation.x=0.16; group.add(nose);

  const scleraGeo = new THREE.SphereGeometry(0.16,28,22); scleraGeo.scale(1.0,1.12,0.92);
  const pupilGeo = new THREE.SphereGeometry(0.090,24,18);
  const shineGeo = new THREE.SphereGeometry(0.034,14,10);
  const eyeDefs = [ {x:-0.24,y:1.08,z:0.86}, {x:0.24,y:1.02,z:0.86} ];
  const eyes = eyeDefs.map((d,i)=>{ const eg=new THREE.Group();
    const sc=new THREE.Mesh(scleraGeo,scleraMat); const pu=new THREE.Mesh(pupilGeo,pupilMat); pu.position.set(0,0,0.11);
    const sh=new THREE.Mesh(shineGeo,shineMat); sh.position.set(-0.03,0.038,0.165);
    eg.add(sc,pu,sh); eg.name=`eye_${i===0?'L':'R'}`; eg.position.set(d.x,d.y,d.z); group.add(eg); return eg; });

  const armGeo = makeCapsule(0.17,0.55,16);
  const pawGeo = new THREE.SphereGeometry(0.19,18,14);
  const arms = [-1,1].map((side)=>{ const ag=new THREE.Group(); ag.name=`arm_${side<0?'L':'R'}`;
    const shoulder=new THREE.Vector3(side*0.80,0.55,0.85); const pawPos=new THREE.Vector3(side*0.18,0.15,1.20);
    const arm=new THREE.Mesh(armGeo,yellowMat); orientBetween(arm,shoulder,pawPos);
    const paw=new THREE.Mesh(pawGeo,yellowMat); paw.position.copy(pawPos);
    ag.add(arm,paw); ag.castShadow=true; group.add(ag); return ag; });

  const footGeo = new THREE.SphereGeometry(1,22,16); footGeo.scale(0.34,0.26,0.52);
  const feet = [-1,1].map((side)=>{ const foot=new THREE.Mesh(footGeo,yellowMat); foot.name=`foot_${side<0?'L':'R'}`;
    foot.position.set(side*0.54,-1.00,0.80); foot.rotation.z=side*0.62; foot.rotation.y=-side*0.32; foot.rotation.x=-0.35;
    foot.castShadow=true; group.add(foot); return foot; });

  const tailCurve = new THREE.CatmullRomCurve3([ new THREE.Vector3(0.60,-0.55,-0.50), new THREE.Vector3(1.10,-0.60,-0.28),
    new THREE.Vector3(1.45,-0.15,0.05), new THREE.Vector3(1.25,0.45,0.20) ]);
  const tailGeo = taperedTube(tailCurve,72,0.28,0.12,18);
  const tail = new THREE.Mesh(tailGeo, yellowMat); tail.name='tail'; tail.castShadow=true; group.add(tail);
  const tailTip = new THREE.Vector3(); tailCurve.getPointAt(1,tailTip);
  const tailCapGeo = new THREE.SphereGeometry(0.12,18,14);
  const tailCap = new THREE.Mesh(tailCapGeo, yellowMat); tailCap.position.copy(tailTip); tailCap.castShadow=true; group.add(tailCap);

  function applyPose() {
    earL.rotation.set(0,0,THREE.MathUtils.degToRad(20)); earL.rotation.x=-0.15;
    earR.rotation.set(0,0,-THREE.MathUtils.degToRad(60)*params.earSpread); earR.rotation.x=-0.15;
    nose.scale.setScalar(params.noseSize);
    eyes.forEach(e=>{ e.scale.setScalar(params.eyeSize); e.rotation.y=-params.facing; });
    tail.scale.set(1,1+(params.tailLift-1)*0.2,1);
    facing.rotation.y=params.facing; root.rotation.z=params.lean;
  }
  applyPose();
  const materials=[bodyVertexMat,yellowMat,noseMat,scleraMat,pupilMat,shineMat];
  const geometries=[bodyGeo,earLGeo,earRGeo,noseGeo,scleraGeo,pupilGeo,shineGeo,armGeo,pawGeo,footGeo,tailGeo,tailCapGeo];
  return { root, facing, group, params,
    setParams(p={}){ let needBody=false;
      if(p.bellyBulge!==undefined){params.bellyBulge=p.bellyBulge;needBody=true;}
      if(p.earSpread!==undefined)params.earSpread=p.earSpread;
      if(p.noseSize!==undefined)params.noseSize=p.noseSize;
      if(p.eyeSize!==undefined)params.eyeSize=p.eyeSize;
      if(p.tailLift!==undefined)params.tailLift=p.tailLift;
      if(p.lean!==undefined)params.lean=p.lean;
      if(p.facing!==undefined)params.facing=p.facing;
      if(p.bodyHue!==undefined){params.bodyHue=p.bodyHue;const hsl={};YELLOW.getHSL(hsl);yellowMat.color.setHSL((hsl.h+p.bodyHue+1)%1,hsl.s,hsl.l);}
      if(needBody)applyBellyVertexColors(bodyGeo,params.bellyBulge);
      applyPose(); },
    dispose(){ geometries.forEach(g=>g.dispose()); materials.forEach(m=>m.dispose()); } };
}

const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; container.appendChild(renderer.domElement);

const scene = new THREE.Scene(); scene.background=new THREE.Color('#ffffff');
const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0.3,1.10,5.9);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.target.set(0,0.50,0); controls.minDistance=2.5; controls.maxDistance=14;

const hemi = new THREE.HemisphereLight(0xffffff,0xe8d8b0,0.95); scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff4e0,1.15); key.position.set(-4,6,5); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=1; key.shadow.camera.far=25;
key.shadow.camera.left=-5; key.shadow.camera.right=5; key.shadow.camera.top=5; key.shadow.camera.bottom=-5;
key.shadow.bias=-0.0004; key.shadow.radius=4; scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff,0.30); fill.position.set(5,1.5,-3); scene.add(fill);
const ground = new THREE.Mesh(new THREE.CircleGeometry(7,64), new THREE.ShadowMaterial({opacity:0.18}));
ground.rotation.x=-Math.PI/2; ground.position.y=-1.22; ground.receiveShadow=true; scene.add(ground);

const model = createFeeduduModel(); scene.add(model.root);

if (GUI) {
  const gui = new GUI({ title:'肥嘟嘟 · 调参' });
  const state = { ...model.params };
  const onChange = () => model.setParams(state);
  gui.add(state,'bellyBulge',0.80,1.40,0.01).name('大肚程度').onChange(onChange);
  gui.add(state,'earSpread',0.4,1.4,0.01).name('右耳张开').onChange(onChange);
  gui.add(state,'noseSize',0.60,1.50,0.01).name('鼻子大小').onChange(onChange);
  gui.add(state,'eyeSize',0.60,1.50,0.01).name('眼睛大小').onChange(onChange);
  gui.add(state,'tailLift',0.6,1.6,0.01).name('尾巴上翘').onChange(onChange);
  gui.add(state,'lean',-0.05,0.20,0.005).name('身体倾斜').onChange(onChange);
  gui.add(state,'facing',-1.2,0.4,0.01).name('朝向').onChange(onChange);
  gui.add(state,'bodyHue',-0.06,0.06,0.005).name('色相微调').onChange(onChange);
  document.getElementById('reset').onclick = () => { Object.assign(state,DEFAULTS); model.setParams(DEFAULTS); gui.controllersRecursive().forEach(c=>c.updateDisplay()); };
}
document.getElementById('shot').onclick = () => { renderer.render(scene,camera); const a=document.createElement('a'); a.download='feedudu.png'; a.href=renderer.domElement.toDataURL('image/png'); a.click(); };
window.__feedudu = { renderer, scene, camera, model };
window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
(function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
</html>
