<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>肥嘟嘟 海报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden;background:#0e1430;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
  #bg{position:fixed;inset:0}
  #name{position:fixed;left:0;right:0;top:70px;text-align:center;z-index:5}
  #name .t{font-size:120px;font-weight:900;color:#ffd24a;text-shadow:0 4px 24px rgba(0,0,0,.5)}
  #name .s{font-size:34px;color:#cfe0ff;letter-spacing:6px;margin-top:10px}
  #foot{position:fixed;left:0;right:0;bottom:60px;text-align:center;z-index:5;
    font-size:30px;color:#9fb4e6;letter-spacing:2px}
  #foot b{color:#ffd24a}
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="name"><div class="t">肥嘟嘟</div><div class="s">FEEDUDU · 程序化 3D 玩偶</div></div>
  <div id="foot">WorkBuddy <b>×</b> img2threejs · 一张图变成会转的 3D 模型</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const YELLOW=new THREE.Color('#ffcf3a'),CREAM=new THREE.Color('#ffe9a8'),
      NOSE=new THREE.Color('#6b3a1f'),PUPIL=new THREE.Color('#3a241a'),WHITE=new THREE.Color('#ffffff');
function buildBody(){const p=[[0.02,-1.20],[0.55,-1.05],[0.95,-0.80],[1.20,-0.45],[1.24,-0.10],[1.14,0.25],[0.96,0.58],[0.82,0.88],[0.72,1.12],[0.52,1.32],[0.22,1.44],[0.00,1.50]].map(([r,y])=>new THREE.Vector2(r,y));
  const g=new THREE.LatheGeometry(p,120,Math.PI*1.5,Math.PI*2);g.computeVertexNormals();return g;}
function belly(geo){const pos=geo.attributes.position,c=new Float32Array(pos.count*3),col=new THREE.Color();
  for(let i=0;i<pos.count;i++){const y=pos.getY(i),z=pos.getZ(i);const m=THREE.MathUtils.clamp((1-THREE.MathUtils.smoothstep(y,0.10,1.00))*(THREE.MathUtils.smoothstep(z,-0.10,0.95)),0,1);col.copy(YELLOW).lerp(CREAM,m*0.9);c[i*3]=col.r;c[i*3+1]=col.g;c[i*3+2]=col.b;}geo.setAttribute('color',new THREE.BufferAttribute(c,3));}
function tapered(curve,seg,rB,rT,rad){const g=new THREE.TubeGeometry(curve,seg,1,rad,false),pos=g.attributes.position,v=new THREE.Vector3(),cc=new THREE.Vector3();
  for(let i=0;i<=seg;i++){const t=i/seg;curve.getPointAt(t,cc);const r=rB+(rT-rB)*t;for(let j=0;j<=rad;j++){const idx=i*(rad+1)+j;v.fromBufferAttribute(pos,idx).sub(cc).multiplyScalar(r).add(cc);pos.setXYZ(idx,v.x,v.y,v.z);}}g.computeVertexNormals();return g;}
function orient(m,f,t){const d=new THREE.Vector3().subVectors(t,f);m.position.copy(f).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());}

const canvas=document.getElementById('bg');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(2);renderer.setSize(1080,1350);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const grad=ctx=>{}; // placeholder
// 背景渐变
const bgCanvas=document.createElement('canvas');bgCanvas.width=2;bgCanvas.height=1350;const bx=bgCanvas.getContext('2d');
const grd=bx.createLinearGradient(0,0,0,1350);grd.addColorStop(0,'#16204a');grd.addColorStop(1,'#0a0f24');bx.fillStyle=grd;bx.fillRect(0,0,2,1350);
const tex=new THREE.CanvasTexture(bgCanvas);scene.background=tex;
const camera=new THREE.PerspectiveCamera(40,1080/1350,0.1,100);camera.position.set(0.3,0.6,8.6);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,0.1,0);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.2;controls.enablePan=false;controls.enableZoom=false;
const hemi=new THREE.HemisphereLight(0xffffff,0x35406a,1.05);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff0d8,1.3);key.position.set(-4,7,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.far=25;key.shadow.bias=-.0004;scene.add(key);
const rim=new THREE.DirectionalLight(0x88aaff,0.55);rim.position.set(5,2,-4);scene.add(rim);
const ground=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.ShadowMaterial({opacity:.32}));ground.rotation.x=-Math.PI/2;ground.position.y=-1.3;ground.receiveShadow=true;scene.add(ground);

// 模型
const root=new THREE.Group();scene.add(root);
const facing=new THREE.Group();root.add(facing);const g=new THREE.Group();facing.add(g);
const bodyMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.6,metalness:0});
const yMat=new THREE.MeshStandardMaterial({color:YELLOW.clone(),roughness:.6,metalness:0});
const nMat=new THREE.MeshStandardMaterial({color:NOSE.clone(),roughness:.3,metalness:0});
const sMat=new THREE.MeshStandardMaterial({color:WHITE.clone(),roughness:.28,metalness:0});
const pMat=new THREE.MeshStandardMaterial({color:PUPIL.clone(),roughness:.2,metalness:0});
const shMat=new THREE.MeshStandardMaterial({color:WHITE.clone(),roughness:.05,metalness:0});
const bg2=buildBody();belly(bg2);const body=new THREE.Mesh(bg2,bodyMat);body.castShadow=body.receiveShadow=true;g.add(body);
const earL=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.90,12,20),yMat);earL.position.set(-.36,1.45,-.05);earL.castShadow=true;
const earR=new THREE.Mesh(new THREE.CapsuleGeometry(.21,1.18,12,22),yMat);earR.position.set(.40,1.46,-.05);earR.castShadow=true;g.add(earL,earR);
const nose=new THREE.Mesh((()=>{const x=new THREE.SphereGeometry(1,32,24);x.scale(.24,.20,.18);return x;})(),nMat);nose.position.set(0,.82,.84);nose.rotation.x=.16;g.add(nose);
[-.24,.24].forEach((x,i)=>{const eg=new THREE.Group();eg.add(new THREE.Mesh(new THREE.SphereGeometry(.16,28,22).scale(1,1.12,.92),sMat));const pu=new THREE.Mesh(new THREE.SphereGeometry(.09,24,18),pMat);pu.position.set(0,0,.11);const sh=new THREE.Mesh(new THREE.SphereGeometry(.034,14,10),shMat);sh.position.set(-.03,.038,.165);eg.add(pu,sh);eg.position.set(x,i?1.02:1.08,.86);g.add(eg);});
[-1,1].forEach(side=>{const ag=new THREE.Group();const sh=new THREE.Vector3(side*.80,.55,.85),pw=new THREE.Vector3(side*.18,.15,1.20);const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.55,8,16),yMat);orient(arm,sh,pw);const paw=new THREE.Mesh(new THREE.SphereGeometry(.19,18,14),yMat);paw.position.copy(pw);ag.add(arm,paw);ag.castShadow=true;g.add(ag);});
[-1,1].forEach(side=>{const ft=new THREE.Mesh((()=>{const x=new THREE.SphereGeometry(1,22,16);x.scale(.34,.26,.52);return x;})(),yMat);ft.position.set(side*.54,-1.00,.80);ft.rotation.set(-.35,-side*.32,side*.62);ft.castShadow=true;g.add(ft);});
const tc=new THREE.CatmullRomCurve3([new THREE.Vector3(.60,-.55,-.50),new THREE.Vector3(1.10,-.60,-.28),new THREE.Vector3(1.45,-.15,.05),new THREE.Vector3(1.25,.45,.20)]);
const tail=new THREE.Mesh(tapered(tc,72,.28,.12,18),yMat);tail.castShadow=true;const tip=new THREE.Vector3();tc.getPointAt(1,tip);const tipBall=new THREE.Mesh(new THREE.SphereGeometry(.12,18,14),yMat);tipBall.position.copy(tip);g.add(tail,tipBall);
earL.rotation.set(0,0,THREE.MathUtils.degToRad(20));earL.rotation.x=-.15;earR.rotation.set(0,0,-THREE.MathUtils.degToRad(60));earR.rotation.x=-.15;facing.rotation.y=-0.30;root.rotation.z=0.04;

window.addEventListener('resize',()=>{camera.aspect=1080/1350;camera.updateProjectionMatrix();renderer.setSize(1080,1350);});
(function a(){requestAnimationFrame(a);controls.update();renderer.render(scene,camera);})();
setTimeout(()=>{renderer.render(scene,camera);window.__done=true;},3500);
</script>
</body>
</html>
